crons:
  - name: daily-reminders
    description: "Sends garage service reminders whose due_date is today or overdue"
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: overdue-invoices
    description: "Emails customers whose unpaid invoices have passed the payment terms; skips ones reminded in the last 7 days"
    cron: "30 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/overdue-invoices"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: nightly-backup
    description: "Snapshots the full garage database to Emergent Object Storage every night; keeps the last 30"
    cron: "30 2 * * *"
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: subscription-sweep
    description: "Emails 7/3/1-day payment reminders to garage owners and auto-suspends tenants past their subscription expiry"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/subscription-sweep"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
